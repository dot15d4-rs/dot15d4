[package]
edition = "2021"
name = "dot15d4-driver"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[dependencies]
dot15d4-util = { version = "0.0.1", path = "../dot15d4-util", default-features = false }

fugit = "0.3"
generic-array = "1.2"
portable-atomic = "1"
static_cell = "2"
paste = "1"
typenum = "1.18"

cortex-m = { version = "0.7", features = [
    "critical-section-single-core",
], optional = true }
# TODO: Remove HAL dependency.
nrf52840-hal = { version = "0.18", optional = true }
nrf52811-hal = { version = "0.18", optional = true }
nrf5340-net-hal = { version = "0.18", optional = true }
nrf52840-pac = { version = "0.12", optional = true }
nrf52811-pac = { version = "0.12", optional = true }
nrf5340-net-pac = { version = "0.12", optional = true }

defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.0", optional = true }
log = { version = "0.4.21", optional = true }

rtos-trace = { version = "0.2", optional = true }

arbitrary = { version = "1.3.2", features = ["derive"], optional = true }

[features]
nrf = ["dep:cortex-m"]
nrf52840 = ["dep:nrf52840-hal", "dep:nrf52840-pac", "nrf"]
nrf52811 = ["dep:nrf52811-hal", "dep:nrf52811-pac", "nrf"]
nrf5340-net = ["dep:nrf5340-net-hal", "dep:nrf5340-net-pac", "nrf"]

log = ["dep:log", "dot15d4-util/log"]
defmt = ["dep:defmt", "dep:defmt-rtt", "dot15d4-util/defmt"]

# Activate for GPIO tracing
gpio-trace = []

# Activate for SystemView tracing
rtos-trace = ["dep:rtos-trace", "log"]

std = []
fuzz = ["dep:arbitrary"]

_clippy-std = ["std", "fuzz"]
_clippy-no-std = ["nrf52840", "rtos-trace"]
